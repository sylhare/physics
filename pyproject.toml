[project]
name = "physics-explorations"
version = "0.1.0"
description = "Interactive Feynman-style physics visualizations with marimo notebooks"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.10.0",
    "plotly>=5.24.0",
    "polars>=1.0.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.11.0",
]
browser = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "playwright>=1.40.0",
]

[tool.marimo]
package_manager = "uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 180  # 3 minute timeout per test (notebooks can be slow)
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = [
    "F821",    # undefined names — marimo cells share state across functions
    "E501",    # line length — markdown strings with formulas and long plot configs
    "RUF001",  # ambiguous unicode — Greek letters (γ, ρ, etc.) are intentional physics notation
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
]

[tool.ruff.lint.isort]
known-first-party = ["physics", "physics_explorations"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physics_explorations"]
